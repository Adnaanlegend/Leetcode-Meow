<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeetCode Cat Celebration</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="emoji">🐱</span>
      <div>
        <h1>LeetCode Cat</h1>
        <p class="tagline">Celebrate every accepted submission</p>
      </div>
    </header>
    <label class="row">
      <span>Celebrate solved problems</span>
      <input type="checkbox" id="enabled" />
    </label>
    <label class="row">
      <span>Meow sound</span>
      <input type="checkbox" id="sound" />
    </label>
    <footer>Submit or run code that passes and the cat appears. 🎉</footer>
    <script src="popup.js"></script>
  </body>
</html>
